# Builds LocalLeaf and the texcraft-core CLI for every platform and attaches the
# packages to the GitHub release. Runs when a release is published, or manually.
name: Release builds

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and upload to (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            cli: texcraft-core-linux-x64
          - name: Windows x64
            os: windows-latest
            cli: texcraft-core-windows-x64
          - name: macOS universal
            os: macos-latest
            cli: texcraft-core-macos-universal
            tauri_args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev build-essential rpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Test core
        run: cargo test -p texcraft-core

      - name: Build desktop app
        working-directory: desktop
        run: |
          npm ci
          npx tauri build ${{ matrix.tauri_args }}

      - name: Build CLI
        run: |
          mkdir -p dist-cli/${{ matrix.cli }}
          if [ "$RUNNER_OS" = "macOS" ]; then
            cargo build --release -p texcraft-core --target aarch64-apple-darwin
            cargo build --release -p texcraft-core --target x86_64-apple-darwin
            lipo -create -output dist-cli/${{ matrix.cli }}/texcraft-core \
              target/aarch64-apple-darwin/release/texcraft-core target/x86_64-apple-darwin/release/texcraft-core
          else
            cargo build --release -p texcraft-core
            cp target/release/texcraft-core* dist-cli/${{ matrix.cli }}/ 2>/dev/null || true
            rm -f dist-cli/${{ matrix.cli }}/*.d dist-cli/${{ matrix.cli }}/*.pdb
          fi
          cp README.md LICENSE dist-cli/${{ matrix.cli }}/
          cd dist-cli
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a ${{ matrix.cli }}.zip ${{ matrix.cli }}; else tar czf ${{ matrix.cli }}.tar.gz ${{ matrix.cli }}; fi

      - name: Collect release assets
        run: |
          mkdir -p assets
          shopt -s nullglob
          for f in target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm target/release/bundle/appimage/*.AppImage \
                   target/release/bundle/nsis/*-setup.exe target/release/bundle/msi/*.msi \
                   target/universal-apple-darwin/release/bundle/dmg/*.dmg dist-cli/*.tar.gz dist-cli/*.zip; do
            cp "$f" assets/
          done
          if [ "$RUNNER_OS" = "macOS" ]; then
            tar czf "assets/LocalLeaf_${TAG#v}_universal.app.tar.gz" -C target/universal-apple-darwin/release/bundle/macos LocalLeaf.app
          fi
          ls -la assets

      - name: Upload to release
        run: gh release upload "$TAG" assets/* --clobber
