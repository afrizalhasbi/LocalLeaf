[package]
name = "localleaf-sidecar"
version = "1.0.1"
edition = "2021"
description = "LocalLeaf headless backend: serves the editor UI over stdio JSON lines and runs the MCP server"
license = "MIT"

[dependencies]
texcraft-core = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
notify = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
trash = "5"
base64 = "0.22"
