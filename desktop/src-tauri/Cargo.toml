[package]
name = "localleaf"
version = "1.0.0"
edition = "2021"
description = "LocalLeaf: Overleaf-style local-first LaTeX editor built on texcraft-core"
license = "MIT"
repository = "https://github.com/leoaliperti/LocalLeaf"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
texcraft-core = { path = "../.." }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
notify = "8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
trash = "5"
