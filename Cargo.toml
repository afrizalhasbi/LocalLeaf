[package]
name = "texcraft-core"
version = "1.0.1"
edition = "2021"
description = "Native Rust, local-first, agent-ready LaTeX build core with a built-in MCP server"
license = "MIT"
repository = "https://github.com/leoaliperti/LocalLeaf"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[workspace]
members = [".", "desktop/sidecar"]
resolver = "2"
